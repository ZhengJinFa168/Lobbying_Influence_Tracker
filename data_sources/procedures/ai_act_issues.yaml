# Track A stance codebook for the AI Act (S09), extracted verbatim from s09_judge_and_stance.py ISSUES.
# Protected file. Each issue: issue_id, label, choices (the stance values), articles (proposal units the
# Commission's own choice is read from). An issue with no articles is outside the act: `outside_note` is
# recorded as the reason instead of asking the LLM.
issues:
  - issue_id: option
    label: Preferred regulatory option (inception impact assessment)
    choices: [option0_baseline, option1_soft_law, option2_voluntary_labelling, option3a_mandatory_specific_applications,
              option3b_mandatory_high_risk, option3c_mandatory_all_ai, option4_combination]
    articles: [Art1, Art6, Art52, Art69]
  - issue_id: ai_definition
    label: Scope of the AI definition
    choices: [narrow_definition, broad_definition]
    articles: [Art3, AnnexI]
  - issue_id: remote_biometric_id
    label: Remote biometric identification in public spaces
    choices: [ban, restrict_with_exceptions, regulate_as_high_risk, no_specific_rules]
    articles: [Art5]
  - issue_id: conformity_assessment
    label: Who checks high-risk AI before it reaches the market
    choices: [self_assessment, third_party_assessment, mixed]
    articles: [Art43]
  - issue_id: high_risk_list
    label: How high-risk AI is defined
    choices: [closed_list, open_or_updatable_list, case_by_case_criteria]
    articles: [Art6, Art7, AnnexIII]
  - issue_id: sandboxes
    label: Regulatory sandboxes
    choices: [support_sandboxes, oppose_sandboxes]
    articles: [Art53, Art54]
  - issue_id: sme_relief
    label: Relief for SMEs and start-ups
    choices: [support_relief, oppose_relief]
    articles: [Art55]
  - issue_id: liability
    label: Changes to liability rules for AI
    choices: [new_or_adapted_liability_rules, no_change_to_liability_rules]
    articles: []
    outside_note: liability is outside the AI Act
  - issue_id: enforcement
    label: Enforcement and governance
    choices: [central_eu_body, national_authorities, existing_sectoral_authorities]
    articles: [Art56, Art59, Art63]
  - issue_id: standards
    label: Role of harmonised standards
    choices: [rely_on_standards, detailed_rules_in_law]
    articles: [Art40, Art41]
